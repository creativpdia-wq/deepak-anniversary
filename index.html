<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary Film ❤️</title>

<style>
body{
  margin:0;
  background:#0e0e10;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  transition:1s ease;
  padding:20px;
  text-align:center;
}

.show{opacity:1;}

.photo{
  margin-top:20px;
  padding:20px;
  background:#1f1f1f;
  border-radius:12px;
  width:80%;
  max-width:320px;
  color:#aaa;
}

/* WORDLE UI */
input{
  padding:10px;
  margin:10px;
  border-radius:8px;
  border:none;
  text-align:center;
  font-size:16px;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

.grid{
  margin-top:15px;
  display:flex;
  justify-content:center;
}

.tile{
  width:40px;
  height:40px;
  margin:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #444;
  text-transform:uppercase;
  font-weight:bold;
}

.correct{background:#3aa655;}
.present{background:#c9b458;}
.wrong{background:#333;}
</style>
</head>

<body>

<!-- SCENE 1 -->
<div id="s1" class="scene show">
  <h1>14 Years of Us ❤️</h1>
  <p>Nidhi & Deepak</p>
  <div class="photo">Opening Memory</div>
</div>

<!-- WORDLE SCENE -->
<div id="s2" class="scene">
  <h2>Puzzle 1 ❤️</h2>
  <p>Where it all began</p>

  <input id="winput" placeholder="5-letter word">
  <button onclick="checkWord()">Submit</button>

  <div id="grid" class="grid"></div>
  <p id="msg"></p>
</div>

<!-- REST -->
<div id="s3" class="scene">
  <h2>Vegas Memories ❤️</h2>
</div>

<div id="s4" class="scene">
  <h2>Chicago Journey ❤️</h2>
</div>

<div id="s5" class="scene">
  <h2>Prisha ❤️ Our World</h2>
</div>

<div id="s6" class="scene">
  <h1>Happy Anniversary ❤️</h1>
</div>

<script>

const scenes=["s1","s2","s3","s4","s5","s6"];
let i=0;

function showScene(n){
  scenes.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.remove("show");
  });

  document.getElementById(scenes[n]).classList.add("show");
}

/* AUTO PLAY ONLY UNTIL WORDLE */
function autoPlay(){
  if(i===1) return; // STOP at Wordle scene

  i++;
  if(i>=scenes.length) return;

  showScene(i);
  setTimeout(autoPlay,3500);
}

document.addEventListener("DOMContentLoaded",()=>{
  showScene(0);
  setTimeout(autoPlay,3500);
});

/* WORDLE (FIXED) */
const answer="SURAT";

function checkWord(){
  const val=document.getElementById("winput").value.toUpperCase();
  const grid=document.getElementById("grid");
  const msg=document.getElementById("msg");

  grid.innerHTML="";

  for(let j=0;j<5;j++){
    const d=document.createElement("div");
    d.className="tile";

    if(val[j]===answer[j]) d.classList.add("correct");
    else if(answer.includes(val[j])) d.classList.add("present");
    else d.classList.add("wrong");

    d.textContent=val[j]||"";
    grid.appendChild(d);
  }

  if(val===answer){
    msg.innerText="Correct ❤️";

    setTimeout(()=>{
      i=1;
      autoPlay(); // resume movie
      showScene(2);
    },1500);
  } else {
    msg.innerText="Try again ❤️";
  }
}

</script>

</body>
</html>
