<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary Film ❤️</title>

<style>
body{
  margin:0;
  background:#0e0e10;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  transition:1s ease;
  padding:20px;
  text-align:center;
}

.show{opacity:1;}

.photo{
  margin-top:20px;
  padding:20px;
  background:#1f1f1f;
  border-radius:12px;
  width:80%;
  max-width:320px;
  color:#aaa;
}

/* WORDLE */
input{
  padding:10px;
  margin:10px;
  border-radius:8px;
  border:none;
  text-align:center;
}

.tile{
  display:inline-block;
  width:40px;
  height:40px;
  line-height:40px;
  margin:3px;
  border:2px solid #444;
  text-transform:uppercase;
  font-weight:bold;
}

.correct{background:#3aa655;}
.present{background:#c9b458;}
.wrong{background:#333;}
</style>
</head>

<body>

<!-- SCENES -->
<div id="s1" class="scene show">
  <h1>14 Years of Us ❤️</h1>
  <p>Nidhi & Deepak</p>
  <div class="photo">Opening Memory</div>
</div>

<div id="s2" class="scene">
  <h2>Surat — Where it began</h2>

  <input id="winput" placeholder="5-letter word">
  <button onclick="checkWord()">Guess</button>

  <div id="grid"></div>
  <p id="msg"></p>
</div>

<div id="s3" class="scene">
  <h2>Vegas — Memories</h2>
</div>

<div id="s4" class="scene">
  <h2>Chicago — Journey</h2>
</div>

<div id="s5" class="scene">
  <h2>Prisha — Our world ❤️</h2>
</div>

<div id="s6" class="scene">
  <h1>Happy Anniversary ❤️</h1>
</div>

<script>

const scenes=["s1","s2","s3","s4","s5","s6"];
let i=0;

function showScene(n){
  scenes.forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.remove("show");
  });

  const current=document.getElementById(scenes[n]);
  if(current) current.classList.add("show");
}

function next(){
  i++;
  if(i>=scenes.length) return;

  showScene(i);
  setTimeout(next,3500);
}

document.addEventListener("DOMContentLoaded",()=>{
  showScene(0);
  setTimeout(next,3500);
});

/* WORDLE */
const answer="SURAT";

function checkWord(){
  const val=document.getElementById("winput").value.toUpperCase();
  const grid=document.getElementById("grid");

  if(!grid) return;

  grid.innerHTML="";

  for(let j=0;j<5;j++){
    const d=document.createElement("div");
    d.className="tile";

    if(val[j]===answer[j]) d.classList.add("correct");
    else if(answer.includes(val[j])) d.classList.add("present");
    else d.classList.add("wrong");

    d.textContent=val[j]||"";
    grid.appendChild(d);
  }

  if(val===answer){
    document.getElementById("msg").innerText="Correct ❤️";
    setTimeout(()=>showScene(2),1500);
  } else {
    document.getElementById("msg").innerText="Try again ❤️";
  }
}

</script>

</body>
</html>
