<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary Film ❤️</title>

<style>
body{
  margin:0;
  background:#0e0e10;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  opacity:0;
  transition:1s ease;
  text-align:center;
  padding:20px;
}

.show{opacity:1;}
.photo{
  margin-top:20px;
  padding:20px;
  background:#1f1f1f;
  border-radius:12px;
  width:80%;
  max-width:320px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="s1" class="scene show">
  <h1>14 Years of Us ❤️</h1>
  <p>Nidhi & Deepak</p>
  <div class="photo">Opening Memory</div>
</div>

<div id="s2" class="scene">
  <h2>Surat — Where it began</h2>
</div>

<div id="s3" class="scene">
  <h2>Vegas — Memories</h2>
</div>

<div id="s4" class="scene">
  <h2>Chicago — Journey</h2>
</div>

<div id="s5" class="scene">
  <h2>Prisha — Our world ❤️</h2>
</div>

<div id="s6" class="scene">
  <h1>Happy Anniversary ❤️</h1>
</div>

<script>
const scenes = ["s1","s2","s3","s4","s5","s6"];
let i = 0;

/* SAFE SWITCH */
function showScene(n){
  scenes.forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.classList.remove("show");
  });

  const current = document.getElementById(scenes[n]);
  if(current) current.classList.add("show");
}

/* SAFE AUTO PLAY */
function next(){
  i++;
  if(i >= scenes.length) return;

  showScene(i);
  setTimeout(next, 3500);
}

/* START ONLY WHEN PAGE IS READY */
document.addEventListener("DOMContentLoaded", function(){
  showScene(0);
  setTimeout(next, 3500);
});
</script>

</body>
</html>
