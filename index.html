<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>14 Years of Us ❤️</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0e0e10;
  color:white;
  text-align:center;
  overflow:hidden;
}

/* scenes */
.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:1.2s ease;
  padding:20px;
}

.show{opacity:1; z-index:2;}
.hide{opacity:0; z-index:1;}

.photo{
  margin:20px;
  padding:25px;
  width:80%;
  max-width:340px;
  background:#1f1f1f;
  border-radius:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="s1" class="scene show">
  <h1>14 Years of Us ❤️</h1>
  <p>Nidhi & Deepak</p>
  <div class="photo">PHOTO_01</div>
  <p>Loading memories...</p>
</div>

<div id="s2" class="scene">
  <h2>Surat — Where it began</h2>
</div>

<div id="s3" class="scene">
  <h2>Vegas — Our celebration</h2>
</div>

<div id="s4" class="scene">
  <h2>Chicago — Memories built</h2>
</div>

<div id="s5" class="scene">
  <h2>Prisha — Our world ❤️</h2>
</div>

<div id="s6" class="scene">
  <h1>Happy Anniversary ❤️</h1>
  <div class="photo">FINAL PHOTO</div>
</div>

<script>

const scenes = ["s1","s2","s3","s4","s5","s6"];
let index = 0;

/* SAFE SCENE SWITCH */
function show(i){
  scenes.forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      el.classList.remove("show");
      el.classList.add("hide");
    }
  });

  const current = document.getElementById(scenes[i]);
  if(current){
    current.classList.add("show");
  }
}

/* SAFE AUTO RUN */
function next(){
  index++;

  if(index >= scenes.length){
    return; // stop safely (prevents blank crash)
  }

  show(index);
  setTimeout(next, 4000); // slow cinematic pacing
}

/* START ONLY AFTER PAGE LOAD */
window.onload = function(){
  show(0);
  setTimeout(next, 4000);
};

</script>

</body>
</html>
