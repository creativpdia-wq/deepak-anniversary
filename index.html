<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary Game ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f10;
  color:white;
  text-align:center;
}

/* SCREEN SYSTEM (FIXED) */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* BUTTON */
button{
  padding:10px 15px;
  margin:10px;
  border:none;
  border-radius:8px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

/* WORDLE */
.tile{
  width:40px;
  height:40px;
  border:2px solid #444;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:3px;
  font-weight:bold;
  text-transform:uppercase;
}
.correct{background:#538d4e;}
.present{background:#b59f3b;}
.absent{background:#333;}

/* CONNECTIONS */
.word{
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#222;
  border-radius:8px;
  cursor:pointer;
}
.sel{background:#ff4d6d;}
.done{background:#538d4e;}

/* STRANDS */
#board{
  display:grid;
  grid-template-columns:repeat(6,40px);
  gap:5px;
  justify-content:center;
  margin-top:20px;
}
.cell{
  width:40px;height:40px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  cursor:pointer;
  user-select:none;
}
.selCell{background:#555;}
.foundCell{background:#538d4e;}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="screen active">
  <h1>❤️ Anniversary Game</h1>
  <button onclick="go('wordle')">Start</button>
</div>

<!-- WORDLE -->
<div id="wordle" class="screen">
  <h2>Wordle</h2>

  <input id="w" maxlength="5">
  <button onclick="checkWordle()">Guess</button>

  <div id="wboard"></div>
  <p id="wmsg"></p>
</div>

<!-- CONNECTIONS -->
<div id="conn" class="screen">
  <h2>Connections</h2>
  <div id="cgrid"></div>
  <button onclick="go('strands')">Next</button>
</div>

<!-- STRANDS -->
<div id="strands" class="screen">
  <h2>Strands</h2>
  <p>Drag letters</p>
  <div id="board"></div>
  <p id="smsg"></p>
  <button onclick="go('cross')">Next</button>
</div>

<!-- CROSSWORD -->
<div id="cross" class="screen">
  <h2>Mini Crossword</h2>

  <p>City we met</p>
  <input id="c1">

  <p>Trip city</p>
  <input id="c2">

  <p>Daughter name</p>
  <input id="c3">

  <button onclick="checkCross()">Submit</button>

  <p id="cmsg"></p>
</div>

<!-- FINAL -->
<div id="final" class="screen">
  <h1>Happy Anniversary ❤️</h1>
</div>

<script>

/* NAVIGATION (FIXED) */
function go(id){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

/* WORDLE */
const answer="APRIL";

function checkWordle(){
  const val=document.getElementById("w").value.toUpperCase();
  const board=document.getElementById("wboard");

  const row=document.createElement("div");

  for(let i=0;i<5;i++){
    const d=document.createElement("span");
    d.className="tile";

    if(val[i]===answer[i]) d.classList.add("correct");
    else if(answer.includes(val[i])) d.classList.add("present");
    else d.classList.add("absent");

    d.innerText=val[i]||"";
    row.appendChild(d);
  }

  board.appendChild(row);

  if(val===answer){
    document.getElementById("wmsg").innerText="Correct ❤️";
    setTimeout(()=>go("conn"),1000);
  }
}

/* CONNECTIONS */
const groups=[
["SURAT","VEGAS","CHICAGO","HOME"],
["NIDHI","DEEPAK","PRISHA","FAMILY"],
["LOVE","TRUST","CARE","HOPE"],
["MEETING","WEDDING","FOREVER","ANNIVERSARY"]
];

const cgrid=document.getElementById("cgrid");
let selected=[];

groups.flat().sort(()=>Math.random()-0.5).forEach(w=>{
  const d=document.createElement("div");
  d.className="word";
  d.innerText=w;

  d.onclick=()=>{
    if(d.classList.contains("done")) return;

    d.classList.toggle("sel");

    if(d.classList.contains("sel")) selected.push(d);
    else selected=selected.filter(x=>x!==d);

    if(selected.length===4){
      const vals=selected.map(x=>x.innerText);

      const match=groups.find(g=>g.every(v=>vals.includes(v)));

      if(match){
        selected.forEach(x=>{
          x.classList.add("done");
          x.classList.remove("sel");
        });
      }else{
        selected.forEach(x=>x.classList.remove("sel"));
      }

      selected=[];
    }
  };

  cgrid.appendChild(d);
});

/* STRANDS (SAFE SIMPLE VERSION) */
const strandWords=["SURAT","VEGAS","PRISHA","LOVE"];
const letters="SURATVEGASPRISHALOVE".split("");

const board=document.getElementById("board");

let path=[];
let dragging=false;

letters.forEach(l=>{
  const c=document.createElement("div");
  c.className="cell";
  c.innerText=l;

  c.onmousedown=()=>{dragging=true; add(c);}
  c.onmouseover=()=>{if(dragging) add(c);}

  board.appendChild(c);
});

document.onmouseup=()=>{
  dragging=false;

  const word=path.map(x=>x.innerText).join("");

  if(strandWords.includes(word)){
    path.forEach(x=>{
      x.classList.add("foundCell");
    });
    document.getElementById("smsg").innerText="Found: "+word;
  }else{
    path.forEach(x=>x.classList.remove("selCell"));
  }

  path=[];
};

function add(c){
  if(path.includes(c)) return;
  c.classList.add("selCell");
  path.push(c);
}

/* CROSSWORD */
function checkCross(){
  const a=document.getElementById("c1").value.toUpperCase();
  const b=document.getElementById("c2").value.toUpperCase();
  const c=document.getElementById("c3").value.toUpperCase();

  if(a==="SURAT" && b==="VEGAS" && c==="PRISHA"){
    document.getElementById("cmsg").innerText="Perfect ❤️";
    setTimeout(()=>go("final"),1000);
  }else{
    document.getElementById("cmsg").innerText="Try again ❤️";
  }
}

</script>

</body>
</html>
