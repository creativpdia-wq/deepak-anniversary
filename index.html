<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Years of Us ❤️</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0e0e10;
  color:white;
  text-align:center;
}

.screen{
  display:none;
  min-height:100vh;
  padding:20px;
}

.active{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* BUTTONS */
button{
  padding:12px 18px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#ff4d6d;
  color:white;
}

/* SLIDESHOW */
img{
  width:300px;
  max-width:90%;
  border-radius:15px;
  margin:15px;
}

/* WORDLE */
.row{
  display:flex;
  justify-content:center;
}

.tile{
  width:50px;
  height:50px;
  border:2px solid #3a3a3c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  margin:3px;
  text-transform:uppercase;
}

.correct{background:#538d4e;}
.present{background:#b59f3b;}
.absent{background:#3a3a3c;}

/* CONNECTIONS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  max-width:500px;
}

.word{
  background:#222;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  user-select:none;
}

.sel{background:#ff4d6d;}
.done{background:#538d4e;}

/* STRANDS */
#letterGrid{
  display:grid;
  grid-template-columns:repeat(6,40px);
  gap:6px;
  justify-content:center;
  margin:20px auto;
}

.letter{
  width:40px;
  height:40px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  cursor:pointer;
  user-select:none;
}

.found{
  background:#538d4e;
}

/* CROSSWORD */
.cw{
  text-align:left;
  max-width:300px;
  margin:auto;
}

input{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  text-align:center;
  text-transform:uppercase;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="sab-tera.mp3">
</audio>

<!-- INTRO -->
<div id="intro" class="screen active">
  <h1>14 Years of Us ❤️</h1>

  <img id="slide" src="photo1.jpg">

  <p>Nidhi ❤️ Deepak</p>

  <button onclick="start()">Start Our Story ❤️</button>
</div>

<!-- WORDLE -->
<div id="wordle" class="screen">
  <h2>Wordle ❤️</h2>

  <input id="w" maxlength="5" placeholder="5 letters">
  <button onclick="checkWordle()">Guess</button>

  <div id="board"></div>
  <p id="wm"></p>
</div>

<!-- CONNECTIONS -->
<div id="conn" class="screen">
  <h2>Connections ❤️</h2>

  <div id="grid" class="grid"></div>

  <button onclick="go('strands')">Next</button>
</div>

<!-- STRANDS -->
<div id="strands" class="screen">
  <h2>Strands ❤️</h2>
  <p>SURAT • VEGAS • PRISHA • LOVE</p>

  <div id="letterGrid"></div>

  <p id="sm"></p>

  <button onclick="go('cross')">Next</button>
</div>

<!-- CROSSWORD -->
<div id="cross" class="screen">
  <h2>Mini Crossword ❤️</h2>

  <div class="cw">
    <p>1. City we met</p>
    <input id="c1">

    <p>2. Anniversary trip city</p>
    <input id="c2">

    <p>3. Our daughter</p>
    <input id="c3">

    <p>4. Restaurant</p>
    <input id="c4">
  </div>

  <button onclick="checkCross()">Submit</button>

  <p id="cwmsg"></p>
</div>

<!-- FINAL -->
<div id="final" class="screen">
  <h1>Happy Anniversary ❤️</h1>

  <img src="photo5.jpg">

  <p>From Surat → Vegas → Chicago → Prisha → Forever ❤️</p>
</div>

<script>

/* NAV */
function go(id){
  document.querySelectorAll(".screen")
  .forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* START */
function start(){
  document.getElementById("music").play().catch(()=>{});
  go("wordle");
}

/* SLIDESHOW */
let i=0;
const pics=["photo1.jpg","photo2.jpg","photo3.jpg","photo4.jpg","photo5.jpg"];

setInterval(()=>{
  i=(i+1)%pics.length;
  document.getElementById("slide").src=pics[i];
},2500);

/* WORDLE */
const answer="APRIL";
let row=0;

function checkWordle(){

const val=document.getElementById("w").value.toUpperCase();

const board=document.getElementById("board");

if(val.length!==5) return;

const r=document.createElement("div");
r.className="row";

for(let i=0;i<5;i++){

const d=document.createElement("div");
d.className="tile";

if(val[i]===answer[i]) d.classList.add("correct");
else if(answer.includes(val[i])) d.classList.add("present");
else d.classList.add("absent");

d.innerText=val[i]||"";
r.appendChild(d);
}

board.appendChild(r);

if(val===answer){
document.getElementById("wm").innerText="Correct ❤️";
setTimeout(()=>go("conn"),1200);
}

row++;
}

/* CONNECTIONS (FIXED) */
const groups=[
["SURAT","VEGAS","CHICAGO","HOME"],
["NIDHI","DEEPAK","PRISHA","FAMILY"],
["LOVE","TRUST","LAUGHTER","SUPPORT"],
["MEETING","WEDDING","FOREVER","ANNIVERSARY"]
];

const grid=document.getElementById("grid");

let selected=[];

groups.flat()
.sort(()=>Math.random()-0.5)
.forEach(w=>{

const d=document.createElement("div");
d.className="word";
d.innerText=w;

d.onclick=()=>{

if(d.classList.contains("done")) return;

d.classList.toggle("sel");

if(d.classList.contains("sel")){
selected.push(d);
}else{
selected=selected.filter(x=>x!==d);
}

if(selected.length===4){

const vals=selected.map(x=>x.innerText);

const match=groups.find(g=>
g.every(v=>vals.includes(v))
);

if(match){
selected.forEach(x=>{
x.classList.remove("sel");
x.classList.add("done");
});
}

selected=[];
}
};

grid.appendChild(d);
});

/* STRANDS (FIXED) */
const strandWords=["SURAT","VEGAS","PRISHA","LOVE"];
const found=new Set();

const letters="SURATVEGASPRISHALOVE".split("");
const lg=document.getElementById("letterGrid");

let selection=[];

letters.forEach(l=>{

const d=document.createElement("div");
d.className="letter";
d.innerText=l;

d.onclick=()=>{

if(d.classList.contains("found")) return;

d.classList.toggle("sel");

if(d.classList.contains("sel")){
selection.push({el:d,letter:l});
}else{
selection=selection.filter(x=>x.el!==d);
}

if(selection.length===5){

const word=selection.map(x=>x.letter).join("");

if(strandWords.includes(word) && !found.has(word)){

found.add(word);

selection.forEach(x=>{
x.el.classList.add("found");
x.el.classList.remove("sel");
});

document.getElementById("sm").innerText=
"Found: "+word+" ❤️";

}else{
selection.forEach(x=>{
x.el.classList.remove("sel");
});
}

selection=[];
}
};

lg.appendChild(d);

});

/* CROSSWORD */
function checkCross(){

const a=document.getElementById("c1").value.toUpperCase();
const b=document.getElementById("c2").value.toUpperCase();
const c=document.getElementById("c3").value.toUpperCase();
const d=document.getElementById("c4").value.toUpperCase();

if(
a==="SURAT" &&
b==="VEGAS" &&
c==="PRISHA" &&
(d==="BIG BOWL"||d==="BIGBOWL")
){
document.getElementById("cwmsg").innerText="Perfect ❤️";
setTimeout(()=>go("final"),1500);
}else{
document.getElementById("cwmsg").innerText="Try again ❤️";
}

}

</script>

</body>
</html>
