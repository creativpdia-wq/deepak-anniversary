<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️ Cinematic Edition</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  overflow:hidden;
}

/* SCREEN SYSTEM */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
  padding:20px;
  text-align:center;
}
.screen.active{
  opacity:1;
  pointer-events:auto;
}

.bg{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,#1a1a1a,#000);
  z-index:-1;
}

/* BUTTON */
button{
  padding:12px 18px;
  margin:10px;
  border:none;
  border-radius:10px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

/* IMAGES */
img{
  width:260px;
  border-radius:12px;
  margin:10px;
}

/* WORDLE */
.tile{
  width:40px;height:40px;
  border:2px solid #444;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin:3px;
  font-weight:bold;
  text-transform:uppercase;
}
.correct{background:#4caf50;}
.present{background:#c9b458;}
.absent{background:#333;}

/* CONNECTIONS */
.word{
  display:inline-block;
  padding:10px;
  margin:5px;
  background:#222;
  border-radius:8px;
  cursor:pointer;
}
.sel{background:#ff4d6d;}
.done{background:#4caf50;}

/* STRANDS */
#board{
  display:grid;
  grid-template-columns:repeat(6,40px);
  gap:5px;
  margin-top:20px;
}
.cell{
  width:40px;height:40px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  user-select:none;
  cursor:pointer;
}
.active{background:#555;}
.found{background:#4caf50;}

/* FINAL */
.glow{
  text-shadow:0 0 10px #ff4d6d;
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="https://www.youtube.com/watch?v=sZfnwayum2M">
</audio>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="bg"></div>

  <h1 class="glow">Our Story ❤️</h1>
  <p>14 Years • One Journey • Forever</p>

  <img src="photo1.jpg">

  <button onclick="start()">Begin</button>
</div>

<!-- WORDLE -->
<div id="wordle" class="screen">
  <div class="bg"></div>

  <h2>Chapter 1: Wordle</h2>

  <input id="w" maxlength="5">
  <button onclick="checkWordle()">Submit</button>

  <div id="wboard"></div>
  <p id="wmsg"></p>
</div>

<!-- CONNECTIONS -->
<div id="conn" class="screen">
  <div class="bg"></div>

  <h2>Chapter 2: Connections</h2>
  <div id="cgrid"></div>

  <button onclick="go('strands')">Next</button>
</div>

<!-- STRANDS -->
<div id="strands" class="screen">
  <div class="bg"></div>

  <h2>Chapter 3: Strands</h2>
  <p>Drag letters to form words</p>

  <div id="board"></div>
  <p id="smsg"></p>

  <button onclick="go('cross')">Next</button>
</div>

<!-- CROSSWORD -->
<div id="cross" class="screen">
  <div class="bg"></div>

  <h2>Chapter 4: Crossword</h2>

  <input id="c1" placeholder="City we met"><br>
  <input id="c2" placeholder="Trip city"><br>
  <input id="c3" placeholder="Daughter"><br>

  <button onclick="checkCross()">Finish</button>
  <p id="cmsg"></p>
</div>

<!-- FINAL -->
<div id="final" class="screen">
  <div class="bg"></div>

  <h1 class="glow">Forever ❤️</h1>

  <img src="photo2.jpg">
  <img src="photo3.jpg">

  <p>Surat → Vegas → Chicago → Prisha → Us ❤️</p>
</div>

<script>

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function start(){
  document.getElementById("music").play().catch(()=>{});
  show("wordle");
}

function go(id){ show(id); }

/* WORDLE */
const answer="APRIL";

function checkWordle(){
  const val=document.getElementById("w").value.toUpperCase();
  const board=document.getElementById("wboard");

  const row=document.createElement("div");

  for(let i=0;i<5;i++){
    const d=document.createElement("span");
    d.className="tile";

    if(val[i]===answer[i]) d.classList.add("correct");
    else if(answer.includes(val[i])) d.classList.add("present");
    else d.classList.add("absent");

    d.innerText=val[i]||"";
    row.appendChild(d);
  }

  board.appendChild(row);

  if(val===answer){
    document.getElementById("wmsg").innerText="Correct ❤️";
    setTimeout(()=>show("conn"),1200);
  }
}

/* CONNECTIONS */
const groups=[
["SURAT","VEGAS","CHICAGO","HOME"],
["NIDHI","DEEPAK","PRISHA","FAMILY"],
["LOVE","TRUST","CARE","HOPE"],
["MEETING","WEDDING","FOREVER","ANNIVERSARY"]
];

const cgrid=document.getElementById("cgrid");
let sel=[];

groups.flat().sort(()=>Math.random()-0.5).forEach(w=>{
  const d=document.createElement("div");
  d.className="word";
  d.innerText=w;

  d.onclick=()=>{
    d.classList.toggle("sel");

    if(d.classList.contains("sel")) sel.push(d);
    else sel=sel.filter(x=>x!==d);

    if(sel.length===4){
      const vals=sel.map(x=>x.innerText);
      const match=groups.find(g=>g.every(v=>vals.includes(v)));

      if(match){
        sel.forEach(x=>{
          x.classList.add("done");
          x.classList.remove("sel");
        });
      }
      sel=[];
    }
  };

  cgrid.appendChild(d);
});

/* STRANDS */
const strandWords=["SURAT","VEGAS","PRISHA","LOVE"];
const letters="SURATVEGASPRISHALOVE".split("");

const board=document.getElementById("board");
let path=[];
let drag=false;

letters.forEach(l=>{
  const c=document.createElement("div");
  c.className="cell";
  c.innerText=l;

  c.onmousedown=()=>{drag=true; add(c);}
  c.onmouseover=()=>{if(drag) add(c);}

  board.appendChild(c);
});

document.onmouseup=()=>{
  drag=false;

  const word=path.map(x=>x.innerText).join("");

  if(strandWords.includes(word)){
    path.forEach(x=>x.classList.add("found"));
    document.getElementById("smsg").innerText="Found: "+word;
  } else {
    path.forEach(x=>x.classList.remove("active"));
  }

  path=[];
};

function add(c){
  if(path.includes(c)) return;
  c.classList.add("active");
  path.push(c);
}

/* CROSSWORD */
function checkCross(){
  const a=document.getElementById("c1").value.toUpperCase();
  const b=document.getElementById("c2").value.toUpperCase();
  const c=document.getElementById("c3").value.toUpperCase();

  if(a==="SURAT" && b==="VEGAS" && c==="PRISHA"){
    document.getElementById("cmsg").innerText="Perfect ❤️";
    setTimeout(()=>show("final"),1200);
  } else {
    document.getElementById("cmsg").innerText="Try again ❤️";
  }
}

</script>

</body>
</html>
